# NamikazeOS runs OpenRC. This is the master configuration: the init
# system, the runlevel model and the supervision story all live here,
# not in a second init.
#
# Runlevels (rc-update manages the symlinks at firstboot; the tree
# tracks only the scripts):
#   boot    - sysfs/udev, rootfs (the NamFS container), logging
#   default - services (dns, ntp, guard, logd, oomd, metrics, ...)
#   shutdown- flush + eject handling (namikaze-live-flush, local.d)

# Start services in parallel where the dependency graph allows.
rc_parallel="YES"

# Interactively supervise the boot: a failing critical service must be
# visible, never silently skipped.
rc_interactive="YES"

# Colors are fine on the console, stripped in serial logs.
rc_color="YES"

# Everything goes to the logger (namikaze-logd picks it up).
rc_logger="YES"

# Every long-running service declares supervisor=supervise-daemon in
# its runscript; daemons that die are restarted by the supervisor,
# not by hand.
rc_supervise="supervise-daemon"

# fstab is informational here: the root is the single NamFS container
# described in etc/fstab and etc/namikaze/namfs.conf.
rc_fstab_timeout=30

# unicode console
unicode="YES"
