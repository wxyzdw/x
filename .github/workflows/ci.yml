name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

# The repository root carries only project meta; the Rust workspace and
# every xtask task live under NamikazeOS/, so all run steps execute there.
# Every action is pinned to the exact commit it was audited at (the ref
# name is kept as a comment) and checkouts persist no credentials.
defaults:
  run:
    working-directory: NamikazeOS

jobs:
  # One job, one command: the xtask ci gate runs the exact sequence the
  # maintainers run locally (guards, build, tests, fmt, clippy, sbom).
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy, rustfmt
          targets: x86_64-unknown-none
      - name: Cache cargo state
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: NamikazeOS
      - name: Full gate (guards + build + tests + fmt + clippy + kernel + sbom)
        run: cargo run -p xtask -- ci
      - name: Upload SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sbom
          path: NamikazeOS/dist/sbom.json

  # Static cross builds for the musl targets. All crates are pure Rust,
  # so the bundled rust-lld links them without any external toolchain:
  # the sysroot bin directory just needs to be on PATH (aarch64 musl
  # emits linker flags the host system ld rejects).
  static:
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - run: rustup target add ${{ matrix.target }}
      - name: Put the bundled rust-lld on PATH
        run: echo "$(rustc --print sysroot)"/lib/rustlib/*/bin >> "$GITHUB_PATH"
      - name: Static release build
        run: cargo build --release --workspace --target ${{ matrix.target }}
      - name: Collect binaries
        run: |
          mkdir -p "dist/bin-${{ matrix.target }}"
          for b in target/${{ matrix.target }}/release/namikaze-*; do
            if [ -x "$b" ]; then
              cp "$b" "dist/bin-${{ matrix.target }}/"
            fi
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: namikaze-bin-${{ matrix.target }}
          path: NamikazeOS/dist/bin-${{ matrix.target }}

  # Tag pushes cut a release: seal id, SBOM and checksums as artifacts.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [gate, static]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: x86_64-unknown-none
      - name: Dist artifacts (bootid + sbom + checksums)
        run: |
          cargo run -p xtask -- bootid
          cargo run -p xtask -- sbom
          cargo run -p xtask -- kernel
          cargo run -p xtask -- verify
      - name: OneISO image (pure-Rust ISO9660 + El Torito writer)
        run: cargo run -p xtask -- iso
      - name: Create release with artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "NamikazeOS $GITHUB_REF_NAME" \
            --generate-notes \
            dist/NamikazeOS-*-oneiso.iso dist/NamikazeOS-*-oneiso.iso.sha256 \
            dist/sbom.json dist/bootid dist/SHA256SUMS \
            || gh release upload "$GITHUB_REF_NAME" --clobber \
                 dist/NamikazeOS-*-oneiso.iso dist/NamikazeOS-*-oneiso.iso.sha256 \
                 dist/sbom.json dist/bootid dist/SHA256SUMS
