# SPDX-License-Identifier: MPL-2.0
# NamikazeIMG boot menu (Limine, BSD-2-Clause licensed bootloader).
#
# The image is one disk, one partition, everything encrypted: the
# NAMIKAZE_ROOT partition is a whole NamFS v2 volume and the rootfs rides
# inside it as one verified rootfs.nampack stream. namikaze-init stages
# the partition, opens it with the passphrase and unpacks the rootfs
# before pivoting into it; these entries only pick the live mode and the
# kernel/initrd pair that /boot carries outside the seal. One boot tree
# per architecture, named after the Limine ${ARCH} built-in macro values
# (boot/x86-64, boot/aarch64, boot/riscv64, boot/loongarch64), so a
# single entry set serves every machine; Limine hides entries whose path
# does not resolve.
#
# Placeholders substituted at image write time:
#   @BOOTID@ - the bootid seal stamped into /.boot/bootid

timeout: 5
default_entry: 1

/NamikazeOS (live, persistent)
    comment: Default. Upper layer on the encrypted volume; reboots keep everything.
    protocol: linux
    path: boot():/boot/${ARCH}/vmlinuz
    module_path: boot():/boot/${ARCH}/initrd.img
    cmdline: namikaze.live=persist namikaze.bootid=@BOOTID@ quiet loglevel=3

/NamikazeOS (live, volatile - leaves no trace)
    comment: tmpfs upper layer; nothing is ever written back.
    protocol: linux
    path: boot():/boot/${ARCH}/vmlinuz
    module_path: boot():/boot/${ARCH}/initrd.img
    cmdline: namikaze.live=volatile namikaze.bootid=@BOOTID@ quiet loglevel=3

/NamikazeOS (live, keep the seal in RAM)
    comment: System image copied to RAM; the media can be removed.
    protocol: linux
    path: boot():/boot/${ARCH}/vmlinuz
    module_path: boot():/boot/${ARCH}/initrd.img
    cmdline: namikaze.live=ram namikaze.bootid=@BOOTID@ quiet loglevel=3

/NamikazeOS (live, session persistence)
    comment: RAM during the session, flushed to the volume on clean shutdown.
    protocol: linux
    path: boot():/boot/${ARCH}/vmlinuz
    module_path: boot():/boot/${ARCH}/initrd.img
    cmdline: namikaze.live=session namikaze.bootid=@BOOTID@ quiet loglevel=3

/NamikazeOS (safe mode - hardening disabled)
    comment: Fallback entry for debugging boot failures (no lockdown, verbose logs).
    protocol: linux
    path: boot():/boot/${ARCH}/vmlinuz
    module_path: boot():/boot/${ARCH}/initrd.img
    cmdline: namikaze.live=volatile namikaze.bootid=@BOOTID@ namikaze.safe=yes loglevel=7

/NamikazeOS (recovery shell)
    comment: Minimal offline shell for rescue work; the seal stays closed.
    protocol: linux
    path: boot():/boot/${ARCH}/vmlinuz
    module_path: boot():/boot/${ARCH}/initrd.img
    cmdline: namikaze.live=volatile namikaze.recovery=yes namikaze.bootid=@BOOTID@
