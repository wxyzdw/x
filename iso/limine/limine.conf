# SPDX-License-Identifier: MPL-2.0
# NamikazeOS OneISO boot menu (Limine, BSD-2-Clause licensed bootloader).
#
# The ISO carries one boot tree per architecture, named after the Limine
# ${ARCH} built-in macro values so a single entry set serves every machine:
#   boot/x86-64, boot/aarch64, boot/riscv64, boot/loongarch64
# Limine hides entries whose path does not resolve, so on any given machine
# the menu shows exactly the six modes below. ppc64le boots through
# Petitboot's ISO9660 discovery (it does not read this file) and armv7
# boards boot the armhf tree straight from U-Boot.
#
# Placeholders substituted by scripts/mkiso.sh at ISO build time:
#   @BOOTID@ - the bootid seal stamped into /.boot/bootid
#   @VERITY@ - dm-verity root hash of the squashfs; dropped entirely when
#              no hash was produced (verification is then skipped by
#              namikaze-init, matching the documented dev flow)

timeout: 5
default_entry: 1

/NamikazeOS (live, persistent)
    comment: Default. Upper layer on the LUKS2 persist volume; reboots keep everything.
    protocol: linux
    path: boot():/boot/${ARCH}/vmlinuz
    module_path: boot():/boot/${ARCH}/initrd.img
    cmdline: root=live:CDLABEL=NAMIKAZE_ISO rd.live.squashimg=/boot/${ARCH}/rootfs.img namikaze.live=persist namikaze.bootid=@BOOTID@ namikaze.verity=@VERITY@ quiet loglevel=3

/NamikazeOS (live, volatile - leaves no trace)
    comment: tmpfs upper layer; nothing is ever written back.
    protocol: linux
    path: boot():/boot/${ARCH}/vmlinuz
    module_path: boot():/boot/${ARCH}/initrd.img
    cmdline: root=live:CDLABEL=NAMIKAZE_ISO rd.live.squashimg=/boot/${ARCH}/rootfs.img namikaze.live=volatile namikaze.bootid=@BOOTID@ namikaze.verity=@VERITY@ quiet loglevel=3

/NamikazeOS (live, copy to RAM and release media)
    comment: System image copied to RAM; the media can be removed.
    protocol: linux
    path: boot():/boot/${ARCH}/vmlinuz
    module_path: boot():/boot/${ARCH}/initrd.img
    cmdline: root=live:CDLABEL=NAMIKAZE_ISO rd.live.squashimg=/boot/${ARCH}/rootfs.img namikaze.live=ram namikaze.bootid=@BOOTID@ namikaze.verity=@VERITY@ quiet loglevel=3

/NamikazeOS (live, session persistence)
    comment: RAM during the session, flushed to the volume on clean shutdown.
    protocol: linux
    path: boot():/boot/${ARCH}/vmlinuz
    module_path: boot():/boot/${ARCH}/initrd.img
    cmdline: root=live:CDLABEL=NAMIKAZE_ISO rd.live.squashimg=/boot/${ARCH}/rootfs.img namikaze.live=session namikaze.bootid=@BOOTID@ namikaze.verity=@VERITY@ quiet loglevel=3

/NamikazeOS (safe mode - hardening disabled)
    comment: Fallback entry for debugging boot failures (no lockdown, verbose logs).
    protocol: linux
    path: boot():/boot/${ARCH}/vmlinuz
    module_path: boot():/boot/${ARCH}/initrd.img
    cmdline: root=live:CDLABEL=NAMIKAZE_ISO rd.live.squashimg=/boot/${ARCH}/rootfs.img namikaze.live=volatile namikaze.bootid=@BOOTID@ namikaze.verity=@VERITY@ namikaze.safe=yes loglevel=7

/NamikazeOS (recovery shell)
    comment: Minimal offline shell on the live image for rescue work.
    protocol: linux
    path: boot():/boot/${ARCH}/vmlinuz
    module_path: boot():/boot/${ARCH}/initrd.img
    cmdline: root=live:CDLABEL=NAMIKAZE_ISO rd.live.squashimg=/boot/${ARCH}/rootfs.img namikaze.recovery=yes namikaze.bootid=@BOOTID@
