# NamikazeOS persistence allowlist (deployed default)
# bind    - directory content lives on the persist volume
# overlay - path is merged over the read-only system image
# Denied by policy: /usr /boot /lib /lib64 /bin /sbin (dm-verity sealed);
# system package changes flow exclusively through signed image layers
# managed by namikaze-pkg.
/home bind
/etc overlay
/var bind
/root bind
/usr/local overlay
