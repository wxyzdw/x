# NamikazeOS sentinel PAM integration
#
# The PAM module is built with: cargo build --release -p namikaze-sentinel
#   --features pam-module
# and installed as /lib64/security/pam_namikaze_sentinel.so
#
# Recommended chain (greetd / swaylock), after pam_faillock:
#
#   auth  required  pam_faillock.so preauth
#   auth  optional  pam_namikaze_sentinel.so
#   auth  required  pam_unix.so
#   auth  [default=die] pam_faillock.so authfail
#
# Behavior:
#   - failures are appended to the hash-chained audit log
#   - the 4th failure inside 5 minutes triggers capture IF and only if the
#     user granted consent (marker: /etc/namikaze/sentinel/consent)
#   - without a camera or consent the module degrades to audit-only
