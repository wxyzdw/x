[workspace]
resolver = "2"
members = ["crates/sector-*/*", "xtask"]

[workspace.package]
version = "3.0.0-alpha.2"
edition = "2021"
rust-version = "1.75"
license = "MPL-2.0"
authors = ["NamikazeOS Project"]
repository = "https://github.com/wxyzdw/x"

[workspace.dependencies]
# sector-foundation
namikaze-rt = { path = "crates/sector-foundation/namikaze-rt" }
namikaze-common = { path = "crates/sector-core/namikaze-common" }
namikaze-ffi = { path = "crates/sector-core/namikaze-ffi" }
namikaze-i18n = { path = "crates/sector-core/namikaze-i18n" }
# sector-core
namikaze-config = { path = "crates/sector-core/namikaze-config" }
namikaze-doctor = { path = "crates/sector-core/namikaze-doctor" }
namikaze-oomd = { path = "crates/sector-core/namikaze-oomd" }
# sector-platform (boot + hardware)
namikaze-detect = { path = "crates/sector-platform/namikaze-detect" }
namikaze-hal = { path = "crates/sector-platform/namikaze-hal" }
namikaze-init = { path = "crates/sector-platform/namikaze-init" }
# sector-userland
namikaze-userland = { path = "crates/sector-userland/namikaze-userland" }
namikaze-sh = { path = "crates/sector-userland/namikaze-sh" }
# sector-security
namikaze-vault = { path = "crates/sector-security/namikaze-vault" }
namikaze-sentinel = { path = "crates/sector-security/namikaze-sentinel" }
namikaze-guard = { path = "crates/sector-security/namikaze-guard" }
namikaze-seal = { path = "crates/sector-security/namikaze-seal" }
namikaze-watch = { path = "crates/sector-security/namikaze-watch" }
namikaze-sandbox = { path = "crates/sector-security/namikaze-sandbox" }
namikaze-ledger = { path = "crates/sector-security/namikaze-ledger" }
namikaze-secupdate = { path = "crates/sector-security/namikaze-secupdate" }
# sector-network
namikaze-anon = { path = "crates/sector-network/namikaze-anon" }
namikaze-cloak = { path = "crates/sector-network/namikaze-cloak" }
namikaze-dns = { path = "crates/sector-network/namikaze-dns" }
namikaze-usbguard = { path = "crates/sector-network/namikaze-usbguard" }
namikaze-macspin = { path = "crates/sector-network/namikaze-macspin" }
# sector-storage (live persistence + data lifecycle)
namikaze-live-core = { path = "crates/sector-storage/namikaze-live-core" }
namikaze-live = { path = "crates/sector-storage/namikaze-live" }
namikaze-persist-core = { path = "crates/sector-storage/namikaze-persist-core" }
namikaze-persist = { path = "crates/sector-storage/namikaze-persist" }
namikaze-backup = { path = "crates/sector-storage/namikaze-backup" }
namikaze-scrub = { path = "crates/sector-storage/namikaze-scrub" }
namikaze-wipe = { path = "crates/sector-storage/namikaze-wipe" }
namikaze-share = { path = "crates/sector-storage/namikaze-share" }
namikaze-decoy = { path = "crates/sector-storage/namikaze-decoy" }
namikaze-report = { path = "crates/sector-storage/namikaze-report" }
# sector-desk
namikaze-desk = { path = "crates/sector-desk/namikaze-desk" }
namikaze-tune = { path = "crates/sector-desk/namikaze-tune" }
namikaze-firstboot = { path = "crates/sector-desk/namikaze-firstboot" }
namikaze-guest = { path = "crates/sector-desk/namikaze-guest" }
# sector-supply (packages, updates, install, mirror)
namikaze-pkg = { path = "crates/sector-supply/namikaze-pkg" }
namikaze-install = { path = "crates/sector-supply/namikaze-install" }
namikaze-rescue = { path = "crates/sector-supply/namikaze-rescue" }
namikaze-secpatch = { path = "crates/sector-supply/namikaze-secpatch" }
namikaze-mirror = { path = "crates/sector-supply/namikaze-mirror" }
# sector-time
namikaze-chrono = { path = "crates/sector-time/namikaze-chrono" }
namikaze-ntp = { path = "crates/sector-time/namikaze-ntp" }
# sector-observe
namikaze-logd = { path = "crates/sector-observe/namikaze-logd" }
namikaze-metrics = { path = "crates/sector-observe/namikaze-metrics" }

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
overflow-checks = true
debug = false

[profile.dev]
overflow-checks = true
