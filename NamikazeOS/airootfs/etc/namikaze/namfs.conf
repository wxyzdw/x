# NamFS persistence policy for the airootfs live system.
# mode: volatile (tmpfs upper, nothing survives reboot)
#       persistent (the volume below is the writable layer)
#       ask (prompt at boot)
mode = "persistent"

[volume]
# Path of the NamFS container on the persist partition.
path = "/dev/disk/by-partlabel/NAMIKAZE_PERSIST"
label = "namikaze-demo"
# passphrase = "keyfile" reads /etc/namikaze/namfs.key (0600),
#              "prompt" asks at boot, "embedded" uses the demo seal
passphrase = "embedded"
# PBKDF2-HMAC-SHA256 iterations for new volumes (>= 1000)
iterations = 65536
