# SPDX-License-Identifier: MPL-2.0
# Pinned Limine bootloader binaries vendored under iso/payload/limine/<version>/.
#
# Limine is the OneISO bootloader (BSD-2-Clause licensed, see the vendored
# LICENSE). The binaries are official release artifacts of the Limine project;
# they are NOT workspace code and do not affect the zero-third-party-dependency
# rule, which covers Cargo dependencies only. The xtask iso task verifies every
# file below against this lock before staging, so a corrupted or swapped
# payload fails the build.
#
# Release: https://github.com/Limine-Bootloader/Limine/releases/tag/v12.9.6

